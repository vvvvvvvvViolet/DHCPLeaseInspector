name: Tests

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    # Linux: the suite mocks every Windows call (PowerShell, ping, nbtstat,
    # arp), so it needs no Windows runner and starts much faster.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum and behaves differently from 3.11
        # in places (e.g. datetime.fromisoformat); 3.11 is what the .exe
        # build ships.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Qt's xcb platform plugin is loaded even by the offscreen backend.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
