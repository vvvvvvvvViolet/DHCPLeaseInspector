name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name DHCPLeaseInspector main.py

      - uses: actions/upload-artifact@v4
        with:
          name: DHCPLeaseInspector-exe
          path: dist/DHCPLeaseInspector.exe
